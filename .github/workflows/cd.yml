name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed and it was a push
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_SECRET,SESSION_SECRET,CRON_SECRET
          script: |
            cd ~/myi-v3

            # Disk cleanup to prevent "No space left on device" errors
            echo "==> Freeing disk space..."

            # Load nvm so we can remove old Node versions
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            if command -v nvm >/dev/null 2>&1; then
              for ver in $(nvm ls --no-colors 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
                major="${ver%%.*}"
                major="${major#v}"
                if [ "$major" != "22" ]; then
                  echo "Removing unused Node $ver..."
                  nvm uninstall "$ver" 2>/dev/null || true
                fi
              done
            fi

            npm cache clean --force 2>/dev/null || true

            rm -rf apps/frontend/.next
            rm -rf apps/backend/dist
            rm -rf node_modules/.cache
            rm -rf node_modules

            echo "==> Disk cleanup complete."

            # Ensure required secrets are in .env (idempotent)
            for VAR in JWT_SECRET SESSION_SECRET CRON_SECRET; do
              VALUE=$(eval echo \$$VAR)
              if [ -n "$VALUE" ]; then
                grep -q "^${VAR}=" .env 2>/dev/null && sed -i "s|^${VAR}=.*|${VAR}=${VALUE}|" .env || echo "${VAR}=${VALUE}" >> .env
              fi
            done

            git reset --hard HEAD
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh

            echo "==> Ensuring SSL cert is current..."
            sudo certbot renew --non-interactive 2>&1 || echo "Certbot renewal skipped or failed"

            echo "==> Restarting nginx..."
            sudo nginx -t 2>&1
            sudo systemctl restart nginx 2>&1
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
