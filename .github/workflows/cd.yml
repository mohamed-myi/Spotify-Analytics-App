name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed and it was a push
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_SECRET,SESSION_SECRET,CRON_SECRET
          script: |
            cd ~/myi-v3

            # Disk cleanup to prevent "No space left on device" errors
            echo "==> Freeing disk space..."

            # Load nvm so we can remove old Node versions
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            if command -v nvm >/dev/null 2>&1; then
              for ver in $(nvm ls --no-colors 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
                major="${ver%%.*}"
                major="${major#v}"
                if [ "$major" != "22" ]; then
                  echo "Removing unused Node $ver..."
                  nvm uninstall "$ver" 2>/dev/null || true
                fi
              done
            fi

            npm cache clean --force 2>/dev/null || true

            rm -rf apps/frontend/.next
            rm -rf apps/backend/dist
            rm -rf node_modules/.cache
            rm -rf node_modules

            echo "==> Disk cleanup complete."

            # Ensure required secrets are in .env (idempotent)
            for VAR in JWT_SECRET SESSION_SECRET CRON_SECRET; do
              VALUE=$(eval echo \$$VAR)
              if [ -n "$VALUE" ]; then
                grep -q "^${VAR}=" .env 2>/dev/null && sed -i "s|^${VAR}=.*|${VAR}=${VALUE}|" .env || echo "${VAR}=${VALUE}" >> .env
              fi
            done

            git reset --hard HEAD
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh

            echo "============================================"
            echo "==> SSL/Nginx Health Check"
            echo "============================================"

            echo "--- Cert status before renewal ---"
            sudo openssl x509 -in /etc/letsencrypt/live/myiv3.csproject.org/fullchain.pem -noout -dates -subject 2>&1 || echo "FAILED to read cert"
            sudo ls -la /etc/letsencrypt/live/myiv3.csproject.org/ 2>&1 || echo "Cert dir missing"

            echo "--- Attempting certbot renewal ---"
            if command -v certbot >/dev/null 2>&1; then
              sudo certbot renew --force-renewal --non-interactive 2>&1 || echo "Certbot renewal failed"
            else
              echo "certbot not installed -- attempting to install"
              sudo dnf install -y certbot python3-certbot-nginx 2>&1 || sudo yum install -y certbot python3-certbot-nginx 2>&1 || echo "Could not install certbot"
              sudo certbot renew --force-renewal --non-interactive 2>&1 || echo "Certbot renewal failed after install"
            fi

            echo "--- Cert status after renewal ---"
            sudo openssl x509 -in /etc/letsencrypt/live/myiv3.csproject.org/fullchain.pem -noout -dates -subject 2>&1 || echo "FAILED to read cert after renewal"

            echo "--- Restarting nginx ---"
            sudo nginx -t 2>&1
            sudo systemctl restart nginx 2>&1
            sudo systemctl status nginx --no-pager 2>&1 || true

            echo "--- Verification ---"
            sleep 2
            curl -sSf -o /dev/null -w "HTTPS status: %{http_code}\n" --max-time 10 https://myiv3.csproject.org/ 2>&1 || echo "HTTPS request failed"
            sudo ss -tlnp | grep -E ':80|:443' || echo "Nothing listening on 80/443"
            df -h /

            echo "============================================"
            echo "==> End SSL Health Check"
            echo "============================================"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
