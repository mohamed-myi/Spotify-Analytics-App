name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy if CI passed and it was a push
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: JWT_SECRET,SESSION_SECRET,CRON_SECRET
          script: |
            cd ~/myi-v3

            # Disk cleanup to prevent "No space left on device" errors
            echo "==> Freeing disk space..."

            # Load nvm so we can remove old Node versions
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            if command -v nvm >/dev/null 2>&1; then
              for ver in $(nvm ls --no-colors 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' || true); do
                major="${ver%%.*}"
                major="${major#v}"
                if [ "$major" != "22" ]; then
                  echo "Removing unused Node $ver..."
                  nvm uninstall "$ver" 2>/dev/null || true
                fi
              done
            fi

            npm cache clean --force 2>/dev/null || true

            rm -rf apps/frontend/.next
            rm -rf apps/backend/dist
            rm -rf node_modules/.cache
            rm -rf node_modules

            echo "==> Disk cleanup complete."

            # Ensure required secrets are in .env (idempotent)
            for VAR in JWT_SECRET SESSION_SECRET CRON_SECRET; do
              VALUE=$(eval echo \$$VAR)
              if [ -n "$VALUE" ]; then
                grep -q "^${VAR}=" .env 2>/dev/null && sed -i "s|^${VAR}=.*|${VAR}=${VALUE}|" .env || echo "${VAR}=${VALUE}" >> .env
              fi
            done

            git reset --hard HEAD
            git pull origin main
            chmod +x deploy.sh
            ./deploy.sh

            echo "============================================"
            echo "==> SSL/Reverse Proxy Diagnostics"
            echo "============================================"

            echo "--- Ports 80 and 443 ---"
            sudo ss -tlnp | grep -E ':80|:443' || echo "Nothing listening on 80/443"

            echo "--- Nginx ---"
            if command -v nginx >/dev/null 2>&1; then
              echo "nginx found at: $(which nginx)"
              sudo nginx -t 2>&1 || true
              sudo systemctl status nginx --no-pager 2>&1 || true
              echo "--- Nginx config (sites-enabled) ---"
              ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo "No sites-enabled dir"
              cat /etc/nginx/sites-enabled/* 2>/dev/null || true
              cat /etc/nginx/conf.d/*.conf 2>/dev/null || true
            else
              echo "nginx not installed"
            fi

            echo "--- Caddy ---"
            if command -v caddy >/dev/null 2>&1; then
              echo "caddy found at: $(which caddy)"
              sudo systemctl status caddy --no-pager 2>&1 || true
              cat /etc/caddy/Caddyfile 2>/dev/null || true
            else
              echo "caddy not installed"
            fi

            echo "--- SSL Certificates ---"
            sudo ls -la /etc/letsencrypt/live/ 2>/dev/null || echo "No /etc/letsencrypt/live/ directory"
            for domain_dir in /etc/letsencrypt/live/*/; do
              if [ -d "$domain_dir" ]; then
                echo "Cert for: $domain_dir"
                sudo openssl x509 -in "${domain_dir}fullchain.pem" -noout -dates -subject 2>/dev/null || echo "Could not read cert in $domain_dir"
              fi
            done

            echo "--- Disk Space ---"
            df -h

            echo "--- Running Processes (node, nginx, caddy, pm2) ---"
            ps aux | grep -E 'node|nginx|caddy|pm2' | grep -v grep || echo "No matching processes"

            echo "============================================"
            echo "==> End Diagnostics"
            echo "============================================"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
